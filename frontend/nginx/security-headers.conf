# =============================================================================
# Security Headers (shared across all nginx location blocks)
# =============================================================================
# Include this file in any location block that uses add_header, since nginx
# does NOT inherit add_header directives from parent blocks when a child
# block defines its own add_header.
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS - Uncomment when SSL/TLS is configured
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy
# Clerk domains required for authentication UI:
#   - *.clerk.accounts.dev / clerk.accounts.dev — auth scripts, API calls, iframes
#   - img.clerk.com — user profile images
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://clerk.accounts.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://img.clerk.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://*.clerk.accounts.dev https://clerk.accounts.dev; frame-src 'self' https://*.clerk.accounts.dev; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# Permissions Policy
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
