# =============================================================================
# Nginx Configuration for Unstructured Minds Frontend
# Production-ready configuration with security, performance, and reliability
# =============================================================================
# This file is loaded as /etc/nginx/conf.d/default.conf inside the container
# =============================================================================

# -----------------------------------------------------------------------------
# WebSocket Connection Upgrade Map
# -----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# Rate Limiting Zones
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# -----------------------------------------------------------------------------
# Upstream Backend with Keepalive
# -----------------------------------------------------------------------------
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

# =============================================================================
# Main Server Block
# =============================================================================
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # PERFORMANCE: Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.api+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        font/opentype
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        image/x-icon
        image/vnd.microsoft.icon;

    # =========================================================================
    # PERFORMANCE: Connection Settings
    # =========================================================================
    keepalive_timeout 65;
    keepalive_requests 1000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # PERFORMANCE: Client Body Settings
    # =========================================================================
    client_body_timeout 12;
    client_header_timeout 12;
    client_max_body_size 50m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # =========================================================================
    # SECURITY: Headers (applied globally)
    # =========================================================================
    include /etc/nginx/conf.d/security-headers.conf;

    # =========================================================================
    # LOGGING
    # =========================================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # API PROXY: Backend Communication
    # =========================================================================
    location /api/ {
        # Rate limiting: 10 requests/second with burst of 20
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api/;
        proxy_http_version 1.1;

        # Headers for backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (Connection header handled by $connection_upgrade map)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for Claude API calls (long-running requests)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Response buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;

        # Don't buffer request bodies (allows streaming)
        proxy_request_buffering off;

        # Pass through errors for API to handle
        proxy_intercept_errors off;
    }

    # =========================================================================
    # STATIC ASSETS: Vite hashed filenames (immutable)
    # =========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
        try_files $uri =404;
        access_log off;

        # CORS for fonts
        location ~* \.(woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # =========================================================================
    # STATIC FILES: Images, fonts, etc.
    # =========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # FAVICON & ROBOTS
    # =========================================================================
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
        access_log off;
    }

    # =========================================================================
    # SPA FALLBACK: React Router Support
    # =========================================================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            # Re-apply security headers (nginx doesn't inherit from parent when child uses add_header)
            include /etc/nginx/conf.d/security-headers.conf;
        }
    }

    # =========================================================================
    # HEALTH CHECK: Container orchestration
    # =========================================================================
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        default_type text/plain;
    }

    # =========================================================================
    # SECURITY: Block sensitive paths
    # =========================================================================
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # ERROR PAGES
    # =========================================================================
    error_page 400 401 403 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
