# =============================================================================
# Unstructured Minds - Production Docker Compose
# =============================================================================
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose logs -f            # View logs
#   docker compose ps                 # Check status
#
# Prerequisites:
#   1. Copy .env.example to .env
#   2. Set ANTHROPIC_API_KEY in .env (optional, for AI features)
#   3. Configure VAULT_PATH and DATA_PATH if using custom locations
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend - FastAPI Python Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unstructured-minds-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount vault for markdown notes
      - ${VAULT_PATH:-./vault}:/app/vault:rw
      # Mount data directory for DuckDB and CSVs
      - ${DATA_PATH:-./data}:/app/data:rw
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VAULT_PATH=/app/vault
      - DATA_PATH=/app/data
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Frontend - React SPA with Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unstructured-minds-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge

# =============================================================================
# Named Volumes (optional, for Docker-managed storage)
# =============================================================================
# Uncomment these if you prefer Docker-managed volumes over bind mounts:
# volumes:
#   vault-data:
#   app-data:
